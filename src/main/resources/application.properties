spring.application.name=inventory-management
# ===== Server =====
server.port=8080

# ===== MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/distributor_shop?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=subhas
spring.datasource.password=Subhas@1994
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# First run: create. After tables look right, switch to 'update'.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===== Company config (read at startup) =====
app.company.state=Maharashtra
app.invoice.prefix=INV
app.expiry.alert-days=90